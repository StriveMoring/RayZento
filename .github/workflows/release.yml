name: Release RayZento

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git ca-certificates
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax and build with distribution Python
        run: |
          python3 --version
          python3 -B -m compileall -q .
          bash -n install.sh
          python3 -B build_release.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          ./dist/rayzento --version
          ./dist/rayzento profiles
          cd dist
          sha256sum -c rayzento.sha256
      - name: Verify short curl and wget README entries
        run: |
          if command -v curl >/dev/null 2>&1; then
            apt-get remove -y curl
          fi
          python3 -B - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          if Path('/proc/1/comm').read_text().strip() == 'systemd':
              raise SystemExit('This check must run only in the disposable CI container.')
          assert subprocess.run(['bash', '-c', 'command -v curl'], capture_output=True).returncode != 0
          commands = re.findall(r'```bash\n(.*?)\n```', Path('README.md').read_text(), re.S)
          assert len(commands) == 2
          subprocess.run(['apt-get', 'update'], check=True)
          subprocess.run(['apt-get', 'install', '-y', '--no-install-recommends', 'wget', 'ca-certificates'], check=True)
          for command in sorted(commands, key=lambda item: 'curl ' in item):
              if 'curl ' in command:
                  subprocess.run(['apt-get', 'install', '-y', '--no-install-recommends', 'curl'], check=True)
              result = subprocess.run(['bash', '-c', command], text=True, capture_output=True, timeout=180)
              print(result.stdout)
              print(result.stderr)
              assert result.returncode != 0, 'A container must not proceed to systemd installation.'
              assert '需要实际运行 systemd' in result.stderr, 'Download failed before the expected container guard.'
          subprocess.run(['curl', '--version'], check=True)
          print('PASS: both short commands downloaded the installer over HTTPS and safely refused non-systemd CI.')
          PY
  verify-firewall:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated firewall test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iptables
      - name: Verify kernel TCP and UDP filtering in disposable network namespace
        run: |
          sudo unshare --net python3 -B - <<'PY'
          import json
          import socket
          import subprocess
          import sys
          import traceback
          import rayzento_firewall as firewall

          def report_error(kind, error, tb):
              text = ''.join(traceback.format_exception(kind, error, tb))
              print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          sys.excepthook = report_error

          def command(*args, data=None):
              result = subprocess.run(args, input=data, capture_output=True)
              if result.returncode:
                  raise RuntimeError(args[0] + ': ' + result.stderr.decode(errors='replace'))
              return result.stdout

          command('ip', 'link', 'set', 'lo', 'up')
          tcp = socket.socket()
          tcp.bind(('127.0.0.1', 0))
          tcp.listen(8)
          udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          udp.bind(('127.0.0.1', 0))
          udp.settimeout(0.4)
          ports = {('tcp', tcp.getsockname()[1]), ('udp', udp.getsockname()[1])}

          def probe(expected):
              try:
                  connection = socket.create_connection(tcp.getsockname(), timeout=0.4)
                  connection.close()
                  connected = True
              except OSError:
                  connected = False
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as client:
                  client.sendto(b'RayZento-firewall-test', udp.getsockname())
              try:
                  received = udp.recvfrom(100)[0] == b'RayZento-firewall-test'
              except TimeoutError:
                  received = False
              assert (connected, received) == (expected, expected), (connected, received, expected)

          base_rules = '''
          table inet primary {
              chain input {
                  type filter hook input priority 0; policy drop;
                  ct state established,related accept
                  tcp dport 22 accept comment "ssh-keep"
              }
          }
          table ip secondary {
              chain input {
                  type filter hook input priority 10; policy drop;
                  ct state established,related accept
              }
          }
          '''
          command('nft', '-f', '-', data=base_rules.encode())
          probe(False)
          document = json.loads(command('nft', '-j', 'list', 'ruleset'))
          firewall.apply_nftables(document, ports)
          probe(True)
          document = json.loads(command('nft', '-j', 'list', 'ruleset'))
          firewall.apply_nftables(document, set())
          probe(False)
          assert b'ssh-keep' in command('nft', 'list', 'ruleset')
          # This namespace was created solely by this test and contains no host rules.
          command('nft', 'flush', 'ruleset')
          command('iptables', '-P', 'INPUT', 'DROP')
          command('iptables', '-A', 'INPUT', '-m', 'conntrack', '--ctstate', 'ESTABLISHED,RELATED', '-j', 'ACCEPT')
          command('iptables', '-A', 'INPUT', '-p', 'tcp', '--dport', '22', '-j', 'ACCEPT')
          probe(False)
          lines = command('iptables', '-S', 'INPUT').decode().splitlines()
          firewall.apply_iptables(lines, ports)
          probe(True)
          lines = command('iptables', '-S', 'INPUT').decode().splitlines()
          firewall.apply_iptables(lines, set())
          probe(False)
          remaining = command('iptables', '-S', 'INPUT')
          assert b'--dport 22 -j ACCEPT' in remaining and b'-P INPUT DROP' in remaining
          tcp.close()
          udp.close()
          print('PASS: real kernel nftables and iptables open/close TCP+UDP; SSH rule and default policies preserved.')
          PY
      - name: Verify service inspection with the real owned systemd drop-in
        run: |
          sudo python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import rayzento_core as core
          import rayzento_firewall as firewall
          import rayzento_nodes as nodes
          import rayzento_provision as provision

          # A disposable sleep process tests real systemd/Proc inspection; it is not a proxy core test.
          with tempfile.TemporaryDirectory(prefix='rayzento-ci-', dir='/opt') as opt, tempfile.TemporaryDirectory(prefix='rayzento-ci-', dir='/var/lib') as state:
              core.OPT = Path(opt)
              core.ROOT = Path(state)
              core.ORDER = ('sing-box',)
              name = 'rayzento-ci-' + str(os.getpid()) + '.service'
              core.SPECS = {'sing-box': ('SagerNet/sing-box', name)}
              core.core_command = lambda kind, exe, config: [exe, '90']
              core.installed_release = lambda kind, digest: {'tag': 'v1.0.0'}
              folder = core.OPT / 'sing-box'
              folder.mkdir(mode=0o700)
              exe = folder / 'sing-box'
              shutil.copyfile('/usr/bin/sleep', exe)
              exe.chmod(0o755)
              config = folder / 'server.json'
              config.write_text('{}')
              (folder / 'nodes.json').write_text(json.dumps([{'profile': 'anytls', 'client': {}}]))
              unit = core.UNITS / name
              dropdir = core.UNITS / (name + '.d')
              hook = dropdir / '20-rayzento-firewall.conf'
              foreign = dropdir / '99-unmanaged.conf'
              assert not unit.exists() and not dropdir.exists()
              try:
                  unit.write_text(provision.unit_text('sing-box', exe, config))
                  subprocess.run(['systemctl', 'daemon-reload'], check=True)
                  subprocess.run(['systemctl', 'start', name], check=True)
                  pid = core.sysprop(name, 'MainPID')
                  firewall.configure_hooks()
                  assert core.sysprop(name, 'DropInPaths') == str(hook)
                  assert core.inspect('sing-box', require_running=False).pid == int(pid)
                  assert len(nodes.all_nodes()) == 1
                  hook.write_text(firewall.HOOK_TEXT + '# unexpected edit\n')
                  try:
                      core.inspect('sing-box', require_running=False)
                  except core.Failure as error:
                      assert '内容已被修改' in str(error)
                  else:
                      raise AssertionError('Modified owned hook was accepted.')
                  hook.write_text(firewall.HOOK_TEXT)
                  foreign.write_text('[Service]\nEnvironment=RAYZENTO_CI=1\n')
                  subprocess.run(['systemctl', 'daemon-reload'], check=True)
                  try:
                      core.inspect('sing-box', require_running=False)
                  except core.Failure as error:
                      assert '额外' in str(error)
                  else:
                      raise AssertionError('Foreign drop-in was accepted.')
                  foreign.unlink()
                  subprocess.run(['systemctl', 'daemon-reload'], check=True)
                  assert core.inspect('sing-box', require_running=False).pid == int(pid)
                  print('PASS: real systemd owned hook accepted, node inventory readable, modified/foreign hooks rejected, no process restart.')
              finally:
                  subprocess.run(['systemctl', 'stop', name], check=False)
                  unit.unlink(missing_ok=True)
                  if dropdir.exists():
                      shutil.rmtree(dropdir)
                  subprocess.run(['systemctl', 'daemon-reload'], check=True)
          PY
  release:
    needs: [verify-linux, verify-firewall]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release assets
        run: |
          python3 -B build_release.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          bash -n dist/install.sh
          ./dist/rayzento --version
          ./dist/rayzento profiles
          cd dist
          sha256sum -c rayzento.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/install.sh dist/rayzento dist/rayzento.sha256 --verify-tag --generate-notes
